<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
  <title id="ttl">A pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D7E8F7"/>
      <stop offset="62%" stop-color="#EAF4FC"/>
      <stop offset="100%" stop-color="#F7FBFE"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="668" cy="86" r="72" fill="#FFE680" opacity="0.15"/>
  <circle cx="668" cy="86" r="46" fill="#FFE680" opacity="0.95"/>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity="0.88">
    <rect x="82" y="84" width="76" height="24" rx="12"/>
    <circle cx="100" cy="78" r="24"/>
    <circle cx="126" cy="68" r="19"/>
    <circle cx="134" cy="84" r="21"/>
    <rect x="230" y="142" width="56" height="18" rx="9" opacity="0.8"/>
    <circle cx="242" cy="136" r="16"/>
    <circle cx="262" cy="130" r="13"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="430" cy="424" rx="190" ry="14" fill="#9FB6C9" opacity="0.22"/>
  <ellipse cx="430" cy="426" rx="120" ry="12" fill="#9FB6C9" opacity="0.3"/>

  <!-- wheels -->
  <g id="wheel">
    <circle cx="0" cy="0" r="92" fill="#332F42"/>
    <circle cx="0" cy="0" r="80" fill="#EDE8F5"/>
    <path d="M15,0 L76,0 M13,7.5 L65,38 M7.5,13 L38,65 M0,15 L0,76 M-7.5,13 L-38,65 M-13,7.5 L-65,38
             M-15,0 L-76,0 M-13,-7.5 L-65,-38 M-7.5,-13 L-38,-65 M0,-15 L0,-76 M7.5,-13 L38,-65 M13,-7.5 L65,-38"
          fill="none" stroke="#BDAECB" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="10" fill="#6E6684"/>
    <circle cx="0" cy="0" r="4" fill="#332F42"/>
  </g>
  <use href="#wheel" transform="translate(300,330)"/>
  <use href="#wheel" transform="translate(555,330)"/>

  <!-- frame -->
  <g fill="none" stroke="#3D7EA6" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M372,248 L400,330"/>   <!-- seat tube -->
    <path d="M400,330 L512,262"/>   <!-- down tube -->
    <path d="M372,248 L512,262"/>   <!-- top tube -->
    <path d="M400,330 L306,328"/>   <!-- chain stay -->
    <path d="M372,248 L310,322"/>   <!-- seat stay -->
    <path d="M512,262 L550,328"/>   <!-- fork -->
    <path d="M512,262 L502,218"/>   <!-- stem -->
  </g>
  <path d="M486,210 Q502,196 518,210" fill="none" stroke="#2F2C3D" stroke-width="9" stroke-linecap="round"/>
  <rect x="344" y="223" width="56" height="14" rx="7" fill="#383247" transform="rotate(-8 372 230)"/>

  <!-- chain, cranks, pedals -->
  <path d="M398,343 L312,343" stroke="#9A92AC" stroke-width="4" stroke-dasharray="5 4" stroke-linecap="round"/>
  <circle cx="400" cy="330" r="16" fill="#3D7EA6" stroke="#2B5F80" stroke-width="2.5"/>
  <circle cx="400" cy="330" r="5" fill="#5A5470"/>
  <path d="M400,330 L428,350" stroke="#6B6480" stroke-width="9" stroke-linecap="round"/>
  <path d="M400,330 L374,318" stroke="#6B6480" stroke-width="9" stroke-linecap="round"/>
  <rect x="354" y="313.5" width="40" height="7" rx="3.5" fill="#5A5470" transform="rotate(-14 374 317)"/>
  <rect x="408" y="345" width="40" height="7" rx="3.5" fill="#5A5470" transform="rotate(16 428 348)"/>

  <!-- pelican: tail -->
  <path d="M306,150 C278,142 254,154 238,172 C250,194 260,212 248,226 C236,208 242,188 264,178 C280,170 292,162 306,150 Z"
        fill="#FBF6EA" stroke="#2B2733" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M262,158 C252,166 250,174 252,182" fill="none" stroke="#2B2733" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <path d="M274,168 C266,178 264,186 268,196" fill="none" stroke="#2B2733" stroke-width="2" opacity="0.5" stroke-linecap="round"/>

  <!-- pelican: far leg -->
  <path d="M334,212 C322,238 324,262 338,288" fill="none" stroke="#2B2733" stroke-width="12" stroke-linecap="round"/>
  <path d="M334,212 C322,238 324,262 338,288" fill="none" stroke="#F2EBDD" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="348" cy="292" rx="10" ry="5.5" fill="#F2EBDD" stroke="#2B2733" stroke-width="2" transform="rotate(24 348 292)"/>

  <!-- pelican: neck -->
  <path d="M418,188 C456,172 486,146 500,134" fill="none" stroke="#2B2733" stroke-width="31" stroke-linecap="round"/>
  <path d="M418,188 C456,172 486,146 500,134" fill="none" stroke="#FBF6EA" stroke-width="25" stroke-linecap="round"/>

  <!-- pelican: beak + pouch -->
  <path d="M512,106 C556,98 600,104 632,118 C628,130 616,136 596,134 L512,132 Z"
        fill="#F2B44E" stroke="#2B2733" stroke-width="3" stroke-linejoin="round"/>
  <path d="M514,126 C556,130 586,133 596,135 C606,150 624,172 628,194 C632,214 612,228 590,222 C572,218 552,214 536,200 C518,158 514,126 Z"
        fill="#E8873A" stroke="#2B2733" stroke-width="3" stroke-linejoin="round"/>

  <!-- pelican: body -->
  <g transform="rotate(-8 368 170)">
    <ellipse cx="368" cy="170" rx="64" ry="78" fill="#FBF6EA" stroke="#2B2733" stroke-width="3.5"/>
    <path d="M398,110 C408,136 400,164 372,184 C364,212 376,236 398,232 C410,206 406,164 398,110 Z"
          fill="#EFE7D6" stroke="#2B2733" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M404,124 C402,148 398,172 394,196" fill="none" stroke="#D8CBA9" stroke-width="2" opacity="0.85"/>
  </g>

  <!-- pelican: head -->
  <circle cx="500" cy="126" r="34" fill="#FBF6EA" stroke="#2B2733" stroke-width="3.5"/>
  <ellipse cx="484" cy="110" rx="9" ry="6" fill="#FFFFFF" opacity="0.55" transform="rotate(-20 484 110)"/>
  <circle cx="512" cy="114" r="5.5" fill="#2B2733"/>
  <circle cx="514.5" cy="111.5" r="1.9" fill="#FFFFFF"/>

  <!-- pelican: near leg + foot -->
  <path d="M394,224 C416,238 434,250 442,270 C448,292 440,312 428,324" fill="none" stroke="#2B2733" stroke-width="17" stroke-linecap="round"/>
  <path d="M394,224 C416,238 434,250 442,270 C448,292 440,312 428,324" fill="none" stroke="#FBF6EA" stroke-width="11" stroke-linecap="round"/>
  <rect x="398" y="330" width="48" height="16" rx="8" fill="#FBF6EA" stroke="#2B2733" stroke-width="3" transform="rotate(16 422 338)"/>
</svg>