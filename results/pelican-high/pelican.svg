<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cartoon pelican with white feathers, an orange beak and pouch, sits on a bicycle saddle, one wing on the handlebar and feet on the pedals.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf6ff"/>
      <stop offset="1" stop-color="#f9fbf7"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.16"/>
    </filter>

    <style>
      .wheel { fill:none; stroke:#263241; stroke-width:9; }
      .rim { fill:none; stroke:#7d8b9a; stroke-width:5; }
      .spoke { stroke:#b9c4cf; stroke-width:2; }
      .frame { fill:none; stroke:#263241; stroke-width:8; stroke-linecap:round; stroke-linejoin:round; }
      .bird { fill:#fbfcfb; stroke:#263241; stroke-width:6; }
      .bird-2 { fill:#e9eff3; stroke:#263241; stroke-width:6; }
      .wing { fill:#eef4f7; stroke:#263241; stroke-width:6; }
      .beak { fill:#f2a65a; stroke:#263241; stroke-width:5; stroke-linejoin:round; }
      .beak-top { fill:#f7bd63; stroke:#263241; stroke-width:5; stroke-linejoin:round; }
      .leg { fill:none; stroke:#e07a3f; stroke-width:12; stroke-linecap:round; stroke-linejoin:round; }
      .foot { fill:#e07a3f; stroke:#263241; stroke-width:4; stroke-linejoin:round; }
      .detail { fill:none; stroke:#263241; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .cap { fill:#4b5563; stroke:#263241; stroke-width:4; stroke-linejoin:round; }
    </style>
  </defs>

  <rect width="1000" height="620" fill="url(#sky)"/>

  <!-- ground shadow -->
  <ellipse cx="400" cy="552" rx="300" ry="14" fill="#1f2937" opacity="0.10"/>

  <!-- background sun and clouds -->
  <g opacity="0.8">
    <circle cx="830" cy="90" r="40" fill="#ffe9a8"/>
    <path d="M80 120 q28 -22 56 0 q28 -22 56 0" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <path d="M130 150 q24 -16 48 0 q24 -16 48 0" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Bicycle -->
  <g>
    <!-- rear wheel -->
    <circle class="wheel" cx="210" cy="490" r="65"/>
    <circle class="rim" cx="210" cy="490" r="55"/>
    <g class="spoke">
      <line x1="210" y1="490" x2="210" y2="435"/>
      <line x1="210" y1="490" x2="245" y2="475"/>
      <line x1="210" y1="490" x2="255" y2="490"/>
      <line x1="210" y1="490" x2="245" y2="505"/>
      <line x1="210" y1="490" x2="210" y2="545"/>
      <line x1="210" y1="490" x2="175" y2="505"/>
      <line x1="210" y1="490" x2="165" y2="490"/>
      <line x1="210" y1="490" x2="175" y2="475"/>
    </g>
    <circle cx="210" cy="490" r="8" fill="#263241"/>

    <!-- front wheel -->
    <circle class="wheel" cx="590" cy="490" r="65"/>
    <circle class="rim" cx="590" cy="490" r="55"/>
    <g class="spoke">
      <line x1="590" y1="490" x2="590" y2="435"/>
      <line x1="590" y1="490" x2="625" y2="475"/>
      <line x1="590" y1="490" x2="635" y2="490"/>
      <line x1="590" y1="490" x2="625" y2="505"/>
      <line x1="590" y1="490" x2="590" y2="545"/>
      <line x1="590" y1="490" x2="555" y2="505"/>
      <line x1="590" y1="490" x2="555" y2="490"/>
      <line x1="590" y1="490" x2="555" y2="475"/>
    </g>
    <circle cx="590" cy="490" r="8" fill="#263241"/>

    <!-- frame -->
    <g class="frame">
      <path d="M210 490 L370 350 L560 300 L590 490"/>
      <path d="M210 490 L390 490 L560 300"/>
      <path d="M390 490 L370 350"/>
      <path d="M350 380 Q370 362 390 380"/>
      <path d="M560 300 L560 322"/>
      <path d="M560 322 Q545 312 525 314"/>
      <path d="M525 314 L515 326"/>
    </g>

    <!-- chainring and crank -->
    <g>
      <circle cx="390" cy="490" r="20" fill="#263241"/>
      <circle cx="390" cy="490" r="10" fill="none" class="rim"/>
      <path class="frame" d="M390 490 L375 470"/>
      <path class="frame" d="M390 490 L405 470"/>
      <rect x="367" y="464" width="16" height="8" rx="4" fill="#263241"/>
      <rect x="399" y="464" width="16" height="8" rx="4" fill="#263241"/>
    </g>
  </g>

  <!-- Pelican -->
  <g filter="url(#soft)">
    <!-- tail -->
    <path class="bird-2" d="M350 380 L290 370 L315 315 L355 345 Z"/>

    <!-- legs and feet -->
    <g class="leg">
      <path d="M400 400 L385 450 L372 462"/>
      <path d="M425 405 L435 448 L445 460"/>
    </g>
    <g class="foot">
      <path d="M372 462 q-12 0 -12 9 q12 9 12 0 q12 -9 12 -9 z"/>
      <path d="M445 460 q-12 0 -12 9 q12 9 12 0 q12 -9 12 -9 z"/>
    </g>

    <!-- body -->
    <ellipse class="bird" cx="400" cy="360" rx="115" ry="58" transform="rotate(-8 400 360)"/>

    <!-- folded wing coverts -->
    <path class="wing" d="M355 345 Q420 305 490 330 Q455 355 360 365 Z"/>

    <!-- wing reaching toward handlebar -->
    <path class="wing" d="M330 350 C390 330 470 320 545 322 C530 335 470 350 330 350 Z"/>
    <path class="detail" d="M545 310 q5 0 10 0" opacity="0.6"/>

    <!-- neck -->
    <path class="bird" d="M430 345 Q470 320 490 295 L530 300 Q490 345 445 360 Z"/>

    <!-- head -->
    <ellipse class="bird" cx="500" cy="285" rx="46" ry="39"/>

    <!-- cap -->
    <path class="cap" d="M460 258 Q475 232 505 255 Q500 272 480 276 Q458 278 460 258 Z"/>

    <!-- eye -->
    <circle cx="512" cy="270" r="7" fill="#111827"/>
    <circle cx="515" cy="267" r="2.4" fill="#ffffff"/>

    <!-- beak -->
    <path class="beak-top" d="M535 262 C570 250 615 268 645 278 L535 282 Z"/>
    <path class="beak" d="M535 282 C575 296 620 302 645 292 C620 320 575 324 535 300 Z"/>

    <!-- beak seam -->
    <path class="detail" d="M535 282 L645 291" opacity="0.55"/>
  </g>
</svg>